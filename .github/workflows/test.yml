name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-memory-server
          key: mongodb-binaries-${{ runner.os }}

      - name: Instalar dependencias
        run: npm install

      - name: Correr tests
        run: npm test

      # Render corre los .js: si alguien edita solo un .ts, el cambio nunca llega a producción.
      - name: Revisar que los .js salgan de los .ts
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- src)" ]; then
            git status --porcelain -- src
            echo "::error::Los .js de src/ no coinciden con los .ts. Corre 'npm run build' y commitea el resultado."
            exit 1
          fi
